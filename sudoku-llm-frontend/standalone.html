<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Sudoku Resolver (Standalone React Preview)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
  <!-- React 18 & ReactDOM via CDN for immediate zero-build execution -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel standalone to compile JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone@7.28.5/babel.min.js"></script>
  <link rel="stylesheet" href="./src/index.css" />
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="react">
    import {
      DEFAULT_BACKEND_URL, SOLVER_MODES, SOLVER_METRICS, buildRequestBody, solveSudokuWithLLM
    } from './src/services/backendApi.js';
    import { createEmptyBoard, findBoardConflicts, countClues } from './src/utils/sudokuValidator.js';
    import { PRESETS } from './src/utils/presets.js';

    const { useState, useMemo, useEffect } = React;

    // Sudoku Table Component
    function SudokuTable({ board, initialClues, conflicts, fromMock, isSolving, onCellChange, focusedCell, setFocusedCell }) {
      const solverLabel = fromMock ? 'Mock' : 'Solved';
      useEffect(() => {
        if (focusedCell) {
          const el = document.getElementById(`cell-${focusedCell.r}-${focusedCell.c}`);
          if (el) el.focus();
        }
      }, [focusedCell]);

      const handleKeyDown = (e, r, c) => {
        if (isSolving) return;
        if (e.key === 'ArrowUp') { e.preventDefault(); setFocusedCell({ r: Math.max(0, r - 1), c }); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); setFocusedCell({ r: Math.min(8, r + 1), c }); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); setFocusedCell({ r, c: Math.max(0, c - 1) }); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); setFocusedCell({ r, c: Math.min(8, c + 1) }); }
        else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
          e.preventDefault();
          onCellChange(r, c, 0);
        } else if (['1','2','3','4','5','6','7','8','9'].includes(e.key)) {
          e.preventDefault();
          onCellChange(r, c, Number(e.key));
          if (c < 8) setFocusedCell({ r, c: c + 1 });
          else if (r < 8) setFocusedCell({ r: r + 1, c: 0 });
        }
      };

      const handleInputChange = (e, r, c) => {
        const clean = e.target.value.replace(/[^1-9]/g, '');
        const num = clean.length > 0 ? Number(clean.slice(-1)) : 0;
        onCellChange(r, c, num);
      };

      return (
        <div className="sudoku-table-container">
          <table className="sudoku-table" role="grid" aria-label="Sudoku Grid">
            <tbody>
              {board.map((row, r) => (
                <tr key={`r-${r}`} className={`sudoku-row ${r % 3 === 2 && r !== 8 ? 'subgrid-bottom-border' : ''}`}>
                  {row.map((val, c) => {
                    const isInitialClue = initialClues[r][c] !== 0;
                    const isSolverFill = !isInitialClue && val !== 0;
                    const hasConflict = conflicts.has(`${r},${c}`);
                    const isFocused = focusedCell?.r === r && focusedCell?.c === c;

                    const borderClasses = [
                      c % 3 === 2 && c !== 8 ? 'subgrid-right-border' : '',
                      r % 3 === 2 && r !== 8 ? 'subgrid-bottom-border' : ''
                    ].filter(Boolean).join(' ');

                    const cellStateClass = hasConflict
                      ? 'cell-conflict'
                      : isSolverFill
                      ? 'cell-solved-llm'
                      : isInitialClue
                      ? 'cell-initial-clue'
                      : 'cell-empty';

                    return (
                      <td
                        key={`c-${c}`}
                        className={`sudoku-cell ${borderClasses} ${cellStateClass} ${isFocused ? 'cell-focused' : ''}`}
                        onClick={() => setFocusedCell({ r, c })}
                      >
                        <input
                          id={`cell-${r}-${c}`}
                          type="text"
                          inputMode="numeric"
                          pattern="[1-9]*"
                          maxLength={1}
                          disabled={isSolving}
                          value={val === 0 || val === null ? '' : val}
                          onKeyDown={(e) => handleKeyDown(e, r, c)}
                          onChange={(e) => handleInputChange(e, r, c)}
                          onFocus={() => setFocusedCell({ r, c })}
                          className="cell-input"
                          aria-label={`Row ${r + 1}, Column ${c + 1}`}
                          autoComplete="off"
                        />
                        {isSolverFill && <span className="llm-pill">{solverLabel}</span>}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // App Component
    function App() {
      const [board, setBoard] = useState(() => PRESETS[0].board.map(r => [...r]));
      const [initialClues, setInitialClues] = useState(() => PRESETS[0].board.map(r => [...r]));
      const [focusedCell, setFocusedCell] = useState({ r: 0, c: 0 });
      const [isSolving, setIsSolving] = useState(false);
      const [status, setStatus] = useState('idle');
      const [error, setError] = useState(null);
      const [result, setResult] = useState(null);
      const [comparison, setComparison] = useState({});
      const comparedModes = SOLVER_MODES.filter(({ id }) => comparison[id]);
      const [isConfigOpen, setIsConfigOpen] = useState(false);
      const [showPayloadPreview, setShowPayloadPreview] = useState(false);

      const [backendConfig, setBackendConfig] = useState({
        endpoint: DEFAULT_BACKEND_URL,
        apiKey: '',
        mode: 'classic',
        useMock: true
      });

      const conflicts = useMemo(() => findBoardConflicts(board), [board]);
      const cluesCount = useMemo(() => countClues(initialClues), [initialClues]);
      const hasConflicts = conflicts.size > 0;

      const handleCellChange = (r, c, val) => {
        if (board[r][c] === val && initialClues[r][c] === val) return;
        const newClues = initialClues.map(row => [...row]);
        newClues[r][c] = val;
        setBoard(newClues);
        setInitialClues(newClues);
        setResult(null);
        setComparison({});
        setError(null);
        if (status !== 'idle') setStatus('idle');
      };

      const handleSelectNumber = (num) => {
        if (!focusedCell) return;
        handleCellChange(focusedCell.r, focusedCell.c, num);
      };

      const handleSolve = async (compare = false) => {
        if (hasConflicts) {
          setError('Please resolve conflicting numbers highlighted in red before submitting.');
          return;
        }
        if (cluesCount === 0) {
          setError('Please enter at least one known clue before solving.');
          return;
        }

        setIsSolving(true);
        setStatus('solving');
        setError(null);
        if (compare) setComparison({});

        const modes = compare ? SOLVER_MODES.map(({ id }) => id) : [backendConfig.mode];
        let displayedResult = null;
        const errors = [];
        try {
          for (const mode of modes) {
            try {
              const nextResult = await solveSudokuWithLLM(initialClues, { ...backendConfig, mode });
              if (!displayedResult || mode === backendConfig.mode) displayedResult = nextResult;
              if (nextResult.stats) {
                setComparison(previous => ({ ...previous, [mode]: { stats: nextResult.stats } }));
              }
            } catch (err) {
              const label = SOLVER_MODES.find(({ id }) => id === mode)?.label;
              errors.push(compare ? `${label}: ${err.message}` : err.message);
              if (!backendConfig.useMock) {
                setComparison(previous => ({ ...previous, [mode]: { error: err.message, stats: err.stats } }));
              }
            }
          }
          if (displayedResult) {
            setBoard(displayedResult.solution);
            setResult(displayedResult);
          }
          setError(errors.length ? errors.join(' · ') : null);
          setStatus(displayedResult ? 'success' : 'error');
        } finally {
          setIsSolving(false);
        }
      };

      const handleClear = () => {
        const empty = createEmptyBoard();
        setBoard(empty);
        setInitialClues(empty);
        setStatus('idle');
        setError(null);
        setResult(null);
        setComparison({});
      };

      const handleResetToClues = () => {
        setBoard(initialClues.map(r => [...r]));
        setStatus('idle');
        setError(null);
        setResult(null);
        setComparison({});
      };

      const handleLoadPreset = (presetBoard) => {
        const cloned = presetBoard.map(r => [...r]);
        setBoard(cloned);
        setInitialClues(cloned.map(r => [...r]));
        setStatus('idle');
        setError(null);
        setResult(null);
        setComparison({});
      };

      return (
        <div className="app-container">
          <header className="app-header">
            <div className="header-content">
              <div className="logo-badge">
                <span className="logo-icon">🧩</span>
                <div>
                  <h1 className="logo-title">LLM Sudoku Resolver</h1>
                  <p className="logo-subtitle">Frontend interface for LLM-powered Sudoku solver models</p>
                </div>
              </div>
              <div className="header-actions">
                <button className="btn btn-secondary-sm" onClick={() => setIsConfigOpen(!isConfigOpen)}>
                  ⚙️ Backend Settings
                </button>
              </div>
            </div>
          </header>

          <main className="main-content">
            {/* Backend Config Drawer */}
            <div className="backend-config-card">
              <div className="config-header" onClick={() => setIsConfigOpen(!isConfigOpen)}>
                <div className="config-title">
                  <span>Backend & LLM API Configuration</span>
                </div>
                <div className="config-header-badges">
                  {backendConfig.useMock ? (
                    <span className="badge badge-warning">Simulated Mock Mode</span>
                  ) : (
                    <span className="badge badge-success">Live Backend Mode</span>
                  )}
                  <span className="toggle-chevron">{isConfigOpen ? '▲' : '▼'}</span>
                </div>
              </div>

              {isConfigOpen && (
                <div className="config-body">
                  <p className="config-description">
                    Configure the local backend connection. Requests use a 9×9 grid.
                  </p>
                  <div className="form-grid">
                    <div className="form-group full-width">
                      <label className="form-label">Backend API Endpoint URL</label>
                      <input
                        type="text"
                        className="form-input"
                        value={backendConfig.endpoint}
                        disabled={isSolving || backendConfig.useMock}
                        onChange={(e) => setBackendConfig({ ...backendConfig, endpoint: e.target.value })}
                      />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Authorization Token (Optional)</label>
                      <input
                        type="password"
                        className="form-input"
                        placeholder="Token or Bearer token"
                        value={backendConfig.apiKey}
                        disabled={isSolving || backendConfig.useMock}
                        onChange={(e) => setBackendConfig({ ...backendConfig, apiKey: e.target.value })}
                      />
                    </div>
                    <div className="form-group full-width checkbox-group">
                      <label className="checkbox-label">
                        <input
                          type="checkbox"
                          checked={backendConfig.useMock}
                          disabled={isSolving}
                          onChange={(e) => setBackendConfig({ ...backendConfig, useMock: e.target.checked })}
                        />
                        <span className="checkbox-text">
                          <strong>Enable Local Mock Simulation</strong>
                          <span className="checkbox-subtext">Allows testing frontend animations before backend is connected</span>
                        </span>
                      </label>
                    </div>
                  </div>

                  <div className="payload-preview-section">
                    <button
                      type="button"
                      className="btn btn-text"
                      onClick={() => setShowPayloadPreview(!showPayloadPreview)}
                    >
                      {showPayloadPreview ? 'Hide Request Preview' : 'Preview Backend Request'}
                    </button>
                    {showPayloadPreview && (
                      <div className="payload-code-block">
                        <div className="payload-code-header">
                          <span>{backendConfig.useMock ? 'Example request (mock mode)' : `POST ${backendConfig.endpoint}`}</span>
                          <span className="format-tag">GRID_2D</span>
                        </div>
                        <pre>{JSON.stringify(buildRequestBody(initialClues, backendConfig.mode), null, 2)}</pre>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>

            <div className="sudoku-workspace">
              {/* Left Column: Sudoku Table */}
              <section className="grid-section">
                <div className="grid-card">
                  <div className="grid-card-header">
                    <div className="grid-title">
                      <h2>Sudoku Board</h2>
                      <span className="grid-hint">Click any cell and type 1–9. Arrow keys navigate.</span>
                    </div>
                    <div className="legend">
                      <span className="legend-item"><span className="legend-chip legend-chip-clue"></span> Known Clue</span>
                      <span className="legend-item"><span className="legend-chip legend-chip-llm"></span> Filled by Solver</span>
                      <span className="legend-item"><span className="legend-chip legend-chip-conflict"></span> Conflict</span>
                    </div>
                  </div>

                  <SudokuTable
                    board={board}
                    initialClues={initialClues}
                    conflicts={conflicts}
                    fromMock={result?.fromMock}
                    isSolving={isSolving}
                    onCellChange={handleCellChange}
                    focusedCell={focusedCell}
                    setFocusedCell={setFocusedCell}
                  />
                </div>
              </section>

              {/* Right Column: Controls & Status */}
              <section className="sidebar-section">
                {/* Status Badges */}
                <div className="status-card">
                  <div className="status-row">
                    <div className="stats-badges">
                      <span className="stat-badge">Clues: <strong>{cluesCount}</strong> / 81</span>
                      {hasConflicts ? (
                        <span className="stat-badge stat-badge-danger">⚠️ {conflicts.size} Conflict(s)</span>
                      ) : (
                        <span className="stat-badge stat-badge-success">✓ No Conflicts</span>
                      )}
                      {status === 'success' && result && (
                        <span className="stat-badge stat-badge-info">
                          ⚡ {result.fromMock ? 'Mock Time' : 'Backend Time'}: {result.latencyMs} ms
                        </span>
                      )}
                    </div>
                  </div>

                  {isSolving && (
                    <div className="status-banner status-loading">
                      <span className="pulse-dot"></span>
                      <span>{backendConfig.useMock ? 'Running the local Sudoku solver...' : 'Waiting for the backend to return a solution...'}</span>
                    </div>
                  )}

                  {error && (
                    <div className="status-banner status-error">
                      <span>❌ <strong>Error:</strong> {error}</span>
                    </div>
                  )}

                  {status === 'success' && !error && (
                    <div className="status-banner status-success">
                      <span>✨ <strong>{result?.fromMock ? 'Sudoku solved locally (mock).' : 'Sudoku solved by the backend.'}</strong></span>
                    </div>
                  )}
                  {comparedModes.length > 0 && (
                    <div className="comparison-table-container">
                      <table className="comparison-table">
                        <caption>Results for this puzzle</caption>
                        <thead>
                          <tr>
                            <th scope="col">Metric</th>
                            {comparedModes.map(({ id, label }) => <th key={id} scope="col">{label}</th>)}
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            <th scope="row">Result</th>
                            {comparedModes.map(({ id }) => (
                              <td key={id}>{comparison[id].error ? 'Failed' : 'Solved'}</td>
                            ))}
                          </tr>
                          {SOLVER_METRICS.map(([key, label]) => (
                            <tr key={key}>
                              <th scope="row">{label}</th>
                              {comparedModes.map(({ id }) => {
                                const value = comparison[id].stats?.[key];
                                return <td key={id}>{key === 'elapsed_ms' ? value?.toFixed(2) ?? '—' : value ?? '—'}</td>;
                              })}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>

                {/* Control Actions */}
                <div className="card-panel">
                  <div className="control-bar-wrapper">
                    <div className="form-group">
                      <label className="form-label" htmlFor="solver-mode">Solving method</label>
                      <select id="solver-mode" className="form-select" value={backendConfig.mode}
                        disabled={isSolving || backendConfig.useMock}
                        onChange={(event) => setBackendConfig(previous => ({ ...previous, mode: event.target.value }))}>
                        {SOLVER_MODES.map(({ id, label }) => <option key={id} value={id}>{label}</option>)}
                      </select>
                    </div>
                    <div className="action-buttons-group">
                      <button
                        className={`btn btn-primary ${isSolving ? 'btn-loading' : ''}`}
                        onClick={() => handleSolve()}
                        disabled={isSolving || hasConflicts || cluesCount === 0}
                      >
                        {backendConfig.useMock
                          ? (isSolving ? 'Solving locally...' : 'Solve Locally (Mock)')
                          : (isSolving ? 'Waiting for backend...' : 'Solve')}
                      </button>

                      {!backendConfig.useMock && (
                        <button className="btn btn-secondary" onClick={() => handleSolve(true)}
                          disabled={isSolving || hasConflicts || cluesCount === 0}>
                          Compare all methods
                        </button>
                      )}

                      {result && (
                        <button className="btn btn-secondary" onClick={handleResetToClues} disabled={isSolving}>
                          Reset to Clues
                        </button>
                      )}

                      <button className="btn btn-outline" onClick={handleClear} disabled={isSolving}>
                        Clear Board
                      </button>
                    </div>

                    <div className="presets-group">
                      <span className="presets-label">Load Preset:</span>
                      <div className="presets-buttons">
                        {PRESETS.map((p) => (
                          <button
                            key={p.name}
                            className="btn btn-chip"
                            disabled={isSolving}
                            onClick={() => handleLoadPreset(p.board)}
                          >
                            {p.name}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="numpad-container">
                      <span className="numpad-label">Quick Input Pad:</span>
                      <div className="numpad-keys">
                        {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((num) => (
                          <button
                            key={num}
                            type="button"
                            className="numpad-key"
                            disabled={isSolving}
                            onClick={() => handleSelectNumber(num)}
                          >
                            {num}
                          </button>
                        ))}
                        <button
                          type="button"
                          className="numpad-key numpad-erase"
                          disabled={isSolving}
                          onClick={() => handleSelectNumber(0)}
                          title="Erase cell"
                        >
                          ⌫
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Developer Integration Note */}
                <div className="card-panel developer-notes">
                  <h3 className="notes-title"><span>🔌</span> Backend Integration Note</h3>
                  <p className="notes-text">
                    This frontend sends known clues to your backend. Check <code>src/services/backendApi.js</code> to configure your endpoint, custom auth, and payload schema.
                  </p>
                </div>
              </section>
            </div>
          </main>

          <footer className="app-footer">
            <p>React Frontend for Custom LLM Sudoku Solvers</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
